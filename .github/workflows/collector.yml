name: Config Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run collector
        run: python -u main.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configs-${{ github.run_number }}
          path: configs.txt
          if-no-files-found: warn
          retention-days: 7
